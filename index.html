<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>UPSC LoG — Sign In</title>

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&family=Inter:wght@400;500;600;700&family=Fragment+Mono&display=swap" rel="stylesheet" />

<style>
  :root{
    --navy: #16233F;
    --navy-deep: #0E1830;
    --paper: #F7F4EC;
    --paper-line: #E4DFCF;
    --gold: #C9A227;
    --gold-soft: #E4C669;
    --slate: #5B6472;
    --error: #B3432B;
    --ok: #3C6E47;
  }

  *{ box-sizing:border-box; }
  html,body{ height:100%; margin:0; }

  body{
    font-family:"Inter", sans-serif;
    background:var(--navy-deep);
    color:var(--navy);
    display:flex;
    min-height:100vh;
  }

  /* ---------- Left: brand / context panel ---------- */
  .brand{
    flex:1 1 46%;
    background:
      radial-gradient(circle at 15% 20%, rgba(201,162,39,0.10), transparent 40%),
      linear-gradient(180deg, var(--navy) 0%, var(--navy-deep) 100%);
    color:#EFE9D8;
    padding:56px 56px;
    display:flex;
    flex-direction:column;
    justify-content:space-between;
    position:relative;
    overflow:hidden;
  }
  .brand::before{
    content:"";
    position:absolute;
    inset:18px;
    border:1px solid rgba(228,198,105,0.28);
    pointer-events:none;
  }
  .brand::after{
    content:"";
    position:absolute;
    inset:24px;
    border:1px solid rgba(228,198,105,0.14);
    pointer-events:none;
  }

  .eyebrow{
    font-family:"Fragment Mono", monospace;
    font-size:12px;
    letter-spacing:.18em;
    text-transform:uppercase;
    color:var(--gold-soft);
    margin-bottom:18px;
  }

  .brand h1{
    font-family:"Source Serif 4", serif;
    font-weight:700;
    font-size:clamp(34px, 4vw, 50px);
    line-height:1.08;
    margin:0 0 20px;
  }

  .brand p.lede{
    font-size:16px;
    line-height:1.65;
    color:#C7C2AE;
    max-width:38ch;
    margin:0;
  }

  .stat-row{
    display:flex;
    gap:36px;
    margin-top:44px;
    padding-top:28px;
    border-top:1px solid rgba(239,233,216,0.15);
  }
  .stat .num{
    font-family:"Source Serif 4", serif;
    font-size:26px;
    color:var(--gold-soft);
  }
  .stat .label{
    font-family:"Fragment Mono", monospace;
    font-size:11px;
    letter-spacing:.08em;
    text-transform:uppercase;
    color:#9AA0A8;
    margin-top:4px;
  }

  .brand-footer{
    font-family:"Fragment Mono", monospace;
    font-size:12px;
    color:#8890A0;
    letter-spacing:.02em;
  }

  /* ---------- Right: auth panel ---------- */
  .auth-wrap{
    flex:1 1 54%;
    background:var(--paper);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:40px 24px;
  }

  .ticket{
    width:100%;
    max-width:420px;
    background:#FFFDF8;
    border:1px solid var(--paper-line);
    box-shadow: 0 1px 0 var(--paper-line), 0 24px 48px -24px rgba(14,24,48,0.35);
    position:relative;
  }

  .ticket-header{
    padding:28px 32px 22px;
    border-bottom:1px dashed var(--paper-line);
    display:flex;
    align-items:center;
    justify-content:space-between;
  }
  .ticket-header .mark{
    width:38px; height:38px;
    border:1.5px solid var(--navy);
    border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    font-family:"Source Serif 4", serif;
    font-weight:700;
    font-size:15px;
    color:var(--navy);
  }
  .ticket-header .id-tag{
    font-family:"Fragment Mono", monospace;
    font-size:11px;
    letter-spacing:.08em;
    color:var(--slate);
    text-align:right;
  }

  .ticket-body{ padding:30px 32px 34px; }

  .mode-heading{
    font-family:"Source Serif 4", serif;
    font-weight:600;
    font-size:24px;
    margin:0 0 6px;
  }
  .mode-sub{
    font-size:14px;
    color:var(--slate);
    margin:0 0 26px;
  }

  label{
    display:block;
    font-family:"Fragment Mono", monospace;
    font-size:11px;
    letter-spacing:.06em;
    text-transform:uppercase;
    color:var(--slate);
    margin-bottom:7px;
  }

  .field{ margin-bottom:18px; }

  .password-wrap{
    position:relative;
  }
  .password-wrap input{
    padding-right:44px;
  }
  .eye-toggle{
    position:absolute;
    top:50%;
    right:10px;
    transform:translateY(-50%);
    width:28px;
    height:28px;
    display:flex;
    align-items:center;
    justify-content:center;
    background:none;
    border:none;
    padding:0;
    cursor:pointer;
    color:var(--slate);
    transition:color .15s ease;
  }
  .eye-toggle:hover{ color:var(--navy); }
  .eye-toggle:focus-visible{ outline:2px solid var(--navy); outline-offset:2px; border-radius:4px; }
  .eye-toggle svg{ width:19px; height:19px; }
  .eye-toggle .eye-off{ display:none; }
  .eye-toggle.is-visible .eye{ display:none; }
  .eye-toggle.is-visible .eye-off{ display:block; }

  input[type="email"], input[type="password"], input[type="text"]{
    width:100%;
    padding:12px 14px;
    font-family:"Inter", sans-serif;
    font-size:15px;
    color:var(--navy);
    background:#fff;
    border:1px solid #D8D2BE;
    outline:none;
    transition: border-color .15s ease, box-shadow .15s ease;
  }
  input:focus{
    border-color:var(--navy);
    box-shadow:0 0 0 3px rgba(22,35,63,0.10);
  }

  .submit-btn{
    width:100%;
    padding:13px 16px;
    margin-top:6px;
    background:var(--navy);
    color:#F5F1E4;
    border:none;
    font-family:"Inter", sans-serif;
    font-weight:600;
    font-size:15px;
    letter-spacing:.01em;
    cursor:pointer;
    transition: background .15s ease;
  }
  .submit-btn:hover{ background:var(--navy-deep); }
  .submit-btn:disabled{ opacity:.55; cursor:not-allowed; }

  .divider{
    display:flex;
    align-items:center;
    gap:12px;
    margin:22px 0;
    color:#B9B29A;
    font-family:"Fragment Mono", monospace;
    font-size:11px;
    text-transform:uppercase;
    letter-spacing:.08em;
  }
  .divider::before, .divider::after{
    content:"";
    flex:1;
    height:1px;
    background:var(--paper-line);
  }

  .switch-row{
    text-align:center;
    font-size:13.5px;
    color:var(--slate);
    margin-top:22px;
  }
  .switch-row button{
    background:none;
    border:none;
    color:var(--navy);
    font-weight:600;
    text-decoration:underline;
    text-underline-offset:3px;
    cursor:pointer;
    font-size:13.5px;
    font-family:inherit;
    padding:0;
  }

  .forgot{
    text-align:right;
    margin:-10px 0 18px;
  }
  .forgot button{
    background:none; border:none; padding:0; cursor:pointer;
    font-family:"Inter", sans-serif;
    font-size:12.5px;
    color:var(--slate);
    text-decoration:underline;
    text-underline-offset:3px;
  }

  .status{
    margin-top:16px;
    font-size:13px;
    padding:10px 12px;
    border-left:3px solid transparent;
    display:none;
    line-height:1.5;
  }
  .status.show{ display:block; }
  .status.error{ background:#FBEDE8; border-color:var(--error); color:#7E2E1B; }
  .status.ok{ background:#EBF3EC; border-color:var(--ok); color:#26492D; }

  @media (max-width: 860px){
    body{ flex-direction:column; }
    .brand{ padding:40px 28px; }
    .brand::before, .brand::after{ inset:12px; }
    .stat-row{ margin-top:28px; padding-top:20px; }
  }

  @media (prefers-reduced-motion: reduce){
    *{ transition:none !important; }
  }
</style>
</head>
<body>

  <section class="brand">
    <div>
      <!-- <div class="eyebrow">UPSC · LoG Prelims Booster</div> -->
      <h1>Sign in to avail<br/>PreLog Sectionals 2027.</h1>
      <!-- <p class="lede">100 sectional tests - History , Polity, Geography, Env-Ecology and many more<br>[Current Affairs included]<p> -->
    </div>
    <div>
      <div class="stat-row">
        <div class="stat">
          <div class="num">2027</div>
          <div class="label">Batch cycle</div>
        </div>
        <div class="stat">
          <div class="num">Login</div>
          <div class="label">To register</div>
        </div>
        <div class="stat">
          <div class="num">100</div>
          <div class="label">Sectionals</div>
        </div>
      </div>
      <div class="brand-footer" style="margin-top:28px;">~UPSC LoG Team</div>
    </div>
  </section>

  <section class="auth-wrap">
    <div class="ticket">
      <div class="ticket-header">
        <div class="mark">LoG</div>
        <div class="id-tag">contact - t.me/upsclogger</div>
      </div>

      <div class="ticket-body">
        <h2 class="mode-heading" id="modeHeading">Sign in</h2>
        <p class="mode-sub" id="modeSub">Use a valid email address</p>

        <form id="authForm">
          <div class="field">
            <label for="email">Email</label>
            <input type="email" id="email" autocomplete="email" required />
          </div>
          <div class="field">
            <label for="password">Password</label>
            <div class="password-wrap">
              <input type="password" id="password" autocomplete="current-password" required minlength="6" />
              <button type="button" class="eye-toggle" id="eyeToggle" aria-label="Show password" aria-pressed="false">
                <svg class="eye" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M1.5 12S5 5 12 5s10.5 7 10.5 7-3.5 7-10.5 7S1.5 12 1.5 12Z"/>
                  <circle cx="12" cy="12" r="3"/>
                </svg>
                <svg class="eye-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M17.94 17.94A10.94 10.94 0 0 1 12 19.5C5 19.5 1.5 12 1.5 12a19.6 19.6 0 0 1 4.22-5.6M9.9 4.66A10.6 10.6 0 0 1 12 4.5c7 0 10.5 7.5 10.5 7.5a19.7 19.7 0 0 1-2.16 3.19M14.12 14.12a3 3 0 1 1-4.24-4.24"/>
                  <path d="M1.5 1.5l21 21"/>
                </svg>
              </button>
            </div>
          </div>

          <div class="field" id="codeField" style="display:none;">
            <label for="regCode">Phone Number</label>
            <input type="text" id="regCode" inputmode="numeric" pattern="[0-9]{10}" maxlength="10" placeholder="10-digit code" autocomplete="off" />
          </div>

          <div class="field" id="nameField" style="display:none;">
            <label for="regName">Your registered name</label>
            <input type="text" id="regName" placeholder="Exactly as given by you" autocomplete="off" />
          </div>

          <div class="forgot">
            <button type="button" id="forgotBtn">Forgot password?</button>
          </div>

          <button type="submit" class="submit-btn" id="submitBtn">Sign in</button>
        </form>

        <div class="status" id="statusBox"></div>

        <div class="switch-row">
          <span id="switchPrompt">New here?</span>
          <button type="button" id="switchBtn">Create an account</button>
          <span id="switchPrompt"><br>Payments are activated within 24 hrs<br>[after verification]</span>
        </div>
      </div>
    </div>
  </section>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
  import {
    getAuth,
    onAuthStateChanged,
    signInWithEmailAndPassword,
    createUserWithEmailAndPassword,
    sendPasswordResetEmail
  } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-auth.js";
  import {
    getFirestore,
    doc,
    runTransaction,
    setDoc
  } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";

  // ---- 1. PASTE YOUR FIREBASE CONFIG HERE ----
  // Get this from: Firebase Console -> Project settings -> General -> Your apps -> SDK setup and configuration
  const firebaseConfig = {
    apiKey: "AIzaSyA0TWFwlWS2gtewXNVd74gBlzorgsZ0QM8",
    authDomain: "upsc-log.firebaseapp.com",
    projectId: "upsc-log",
    storageBucket: "upsc-log.firebasestorage.app",
    messagingSenderId: "792972564483",
    appId: "1:792972564483:web:7ce74be546e9fe06c6d636",
    measurementId: "G-ZBT6XYHCCQ"
  };

  // ---- 2. WHERE TO SEND SIGNED-IN USERS ----
  const REDIRECT_URL = "https://upscprelog.github.io/prelog/prelog_home.html";
  // If you want a dashboard/index page instead, point this there,
  // and let that page list the individual test links.

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);

  let mode = "signin"; // or "signup"

  const form         = document.getElementById("authForm");
  const emailInput   = document.getElementById("email");
  const passInput    = document.getElementById("password");
  const submitBtn    = document.getElementById("submitBtn");
  const statusBox    = document.getElementById("statusBox");
  const switchBtn    = document.getElementById("switchBtn");
  const switchPrompt = document.getElementById("switchPrompt");
  const modeHeading  = document.getElementById("modeHeading");
  const modeSub      = document.getElementById("modeSub");
  const forgotBtn    = document.getElementById("forgotBtn");
  const codeField    = document.getElementById("codeField");
  const codeInput    = document.getElementById("regCode");
  const nameField    = document.getElementById("nameField");
  const nameInput    = document.getElementById("regName");
  const eyeToggle    = document.getElementById("eyeToggle");

  eyeToggle.addEventListener("click", () => {
    const isVisible = passInput.type === "text";
    passInput.type = isVisible ? "password" : "text";
    eyeToggle.classList.toggle("is-visible", !isVisible);
    eyeToggle.setAttribute("aria-label", isVisible ? "Show password" : "Hide password");
    eyeToggle.setAttribute("aria-pressed", String(!isVisible));
  });

  function setStatus(message, type){
    statusBox.textContent = message;
    statusBox.className = "status show " + type;
  }
  function clearStatus(){
    statusBox.className = "status";
  }

  function setMode(next){
    mode = next;
    clearStatus();
    if(mode === "signin"){
      modeHeading.textContent = "Sign in";
      modeSub.textContent = "Use the email you registered with.";
      submitBtn.textContent = "Sign in";
      switchPrompt.textContent = "New here?";
      switchBtn.textContent = "Create an account";
      passInput.autocomplete = "current-password";
      codeField.style.display = "none";
      codeInput.required = false;
      nameField.style.display = "none";
      nameInput.required = false;
    } else {
      modeHeading.textContent = "Create account";
      modeSub.textContent = "Enter Phone No. and Your name";
      submitBtn.textContent = "Create account";
      switchPrompt.textContent = "Already registered?";
      switchBtn.textContent = "Sign in instead";
      passInput.autocomplete = "new-password";
      codeField.style.display = "block";
      codeInput.required = true;
      nameField.style.display = "block";
      nameInput.required = true;
    }
  }

  switchBtn.addEventListener("click", () => {
    setMode(mode === "signin" ? "signup" : "signin");
  });

  forgotBtn.addEventListener("click", async () => {
    const email = emailInput.value.trim();
    if(!email){
      setStatus("Enter your email above first, then tap Forgot password.", "error");
      return;
    }
    try{
      await sendPasswordResetEmail(auth, email);
      setStatus("Password reset email sent. Check your inbox.", "ok");
    }catch(err){
      setStatus(friendlyError(err), "error");
    }
  });

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    clearStatus();
    submitBtn.disabled = true;

    const email = emailInput.value.trim();
    const password = passInput.value;

    try{
      if(mode === "signin"){
        await signInWithEmailAndPassword(auth, email, password);
      } else {
        const code = codeInput.value.trim();
        const enteredName = nameInput.value.trim();

        if(!/^\d{10}$/.test(code)){
          setStatus("Phone Number must be exactly 10 digits.", "error");
          submitBtn.disabled = false;
          return;
        }
        if(!enteredName){
          setStatus("Enter the name your code was registered under.", "error");
          submitBtn.disabled = false;
          return;
        }

        // Step 1: atomically reserve the code. Fails if it doesn't exist,
        // is already used, or the name doesn't match the pre-approved record —
        // before any account is created.
        const codeRef = doc(db, "inviteCodes", code);
        await runTransaction(db, async (tx) => {
          const snap = await tx.get(codeRef);
          if(!snap.exists()){
            throw new Error("code/not-found");
          }
          const data = snap.data();
          if(data.used === true){
            throw new Error("code/already-used");
          }
          const onFile = (data.name || "").trim().toLowerCase();
          if(onFile !== enteredName.toLowerCase()){
            throw new Error("code/name-mismatch");
          }
          tx.update(codeRef, {
            used: true,
            boundEmail: email,
            usedAt: new Date().toISOString()
          });
        });

        // Step 2: code is reserved, now create the actual account
        await createUserWithEmailAndPassword(auth, email, password);
      }
      setStatus("Success — redirecting…", "ok");
      // onAuthStateChanged below handles the redirect
    }catch(err){
      setStatus(friendlyError(err), "error");
      submitBtn.disabled = false;
    }
  });

  function friendlyError(err){
    const code = err.code || "";
    const msg = err.message || "";
    if(msg.includes("code/not-found")) return "That Phone Number isn't recognized. Double-check it and try again.";
    if(msg.includes("code/already-used")) return "That Phone Number has already been used. Each code works once only.";
    if(msg.includes("code/name-mismatch")) return "That name doesn't match the name registered against this code.";
    if(code.includes("invalid-email")) return "That email address doesn't look right.";
    if(code.includes("user-not-found") || code.includes("invalid-credential")) return "No account found with that email and password.";
    if(code.includes("wrong-password")) return "Incorrect password. Try again or reset it.";
    if(code.includes("email-already-in-use")) return "An account already exists with that email — try signing in instead.";
    if(code.includes("weak-password")) return "Password should be at least 6 characters.";
    if(code.includes("too-many-requests")) return "Too many attempts. Please wait a moment and try again.";
    return "Something went wrong: " + (err.message || "please try again.");
  }

  // If already signed in (or just successfully signed in), redirect.
  // No gating needed here since this page never acts on a null user —
  // it just leaves the form visible in that case.
  onAuthStateChanged(auth, (user) => {
    if(user){
      window.location.href = REDIRECT_URL;
    }
  });
</script>

</body>
</html>
